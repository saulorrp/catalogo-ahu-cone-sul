# Catálogo AHU no servidor próprio (agiulfo, ou qualquer Docker).
# Passo a passo em deploy/SERVIDOR.md. Uso: docker compose up -d
name: catalogo-ahu

services:
  app:
    image: ghcr.io/saulorrp/catalogo-ahu:latest
    restart: unless-stopped
    ports:
      # Só na própria máquina: o endereço público vem do Tailscale Funnel, que entrega
      # https://<máquina>.<tailnet>.ts.net/ahu/ a este porto (deploy/SERVIDOR.md).
      - "127.0.0.1:8502:7860"
    volumes:
      - modelo:/home/usuario/.cache/ahu-onnx   # e5 e reranker, baixados uma vez
    environment:
      AHU_ONNX_CACHE: /home/usuario/.cache/ahu-onnx
      # A versão completa: e5 em fp32 e o reranker relendo o topo (docs/plano_busca_servidor.md).
      AHU_RERANKER: "1"
      # O app mora em /ahu/ no endereço do Funnel, ao lado de outros sites da máquina.
      # AHU_ROOT_PATH vale para a interface web (padrão); a outra, para AHU_FRONT=streamlit.
      AHU_ROOT_PATH: /ahu
      STREAMLIT_SERVER_BASE_URL_PATH: ahu
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    mem_limit: 4g

  # Confere a cada hora se o GitHub publicou uma imagem nova e reinicia o app com ela.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 3600

volumes:
  modelo:
