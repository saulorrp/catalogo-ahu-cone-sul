name: Hugging Face Space

# A cada mudança no main, envia o app ao Space. Precisa do segredo HF_TOKEN (token de escrita);
# sem ele, o job não faz nada. A variável HF_SPACE troca o Space de destino.
on:
  push:
    branches: [ main, claude/busca-em-disco ]
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE || 'saulorrp/ahu_classificador' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        with:
          python-version: "3.11"
      - name: Enviar ao Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install "huggingface_hub>=0.30"
          cp deploy/README_SPACE.md README.md
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=os.environ["HF_SPACE"], repo_type="space", folder_path=".",
              commit_message=f"Sincroniza {os.environ['GITHUB_SHA'][:7]} do GitHub",
              ignore_patterns=[".git/*", ".github/*", "corpus/*", "legado/*", "avaliacao/*",
                               "tests/*", "docs/capturas/*", "**/__pycache__/*"],
              delete_patterns=["*"],
          )
          PY
