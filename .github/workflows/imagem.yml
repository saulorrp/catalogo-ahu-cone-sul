name: Imagem Docker

# A cada mudança no main, publica a imagem do app em ghcr.io/saulorrp/catalogo-ahu.
# O servidor (deploy/docker-compose.yml) baixa a versão nova sozinho, com o Watchtower.
on:
  push:
    # O ramo da coleção ahu-brasil também publica, para o servidor ir ao ar antes do merge.
    branches: [ main, claude/busca-em-disco ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/catalogo-ahu:latest
            ghcr.io/${{ github.repository_owner }}/catalogo-ahu:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
